<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <title>T Rex Run</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- HEADER TITLE/ HERO  -->

    <header class="header">
      <h1 class="header-h1">🦖DINOSAUR RUN🦖</h1>

      <!-- NAV AREA  -->
      <nav>
        <div class="nav-header">
          <!-- LOGO IN LIGHT & DARK VERSIONS  -->
          <div class="nav-logo">
            <a href="#">
              <img src="" alt="dark logo" class="nav-logo-dark" />
              <img src="" alt="light logo" class="nav-logo-light" />
            </a>
          </div>
        </div>

        <!-- NAV BAR  -->
       <ul class="nav-links" id="navbar">
        <li class="dropdown">
          <button class="dropdown-button">MENU</button>
          <li><a href="#">HOME</a></li>
          <li><a href="#special">SPECIAL</a></li>
          <li><a href="#menu">MENU</a></li>
          <li><a href="#event">EVENT</a></li>
          <li><a href="#contact">CONTACT</a></li>
        </li>
       </ul>
      </nav>

      <!-- ALERT/ GAME STATUS  -->
      <h2 id="alert">Alert!</h2>
    </header>

      <!-- GRID  -->
    <div id="desert" class="desert">
      <div class="grid">
        <div class="dino"></div>
      </div>
    </div>

    <!-- MAIN SECTION -->
    <h2 class="section-title">SECTION</h2>
    <section class="section">
      <div class="dinosaur-fact-list">

        <h4>🦖DINOSAUR FACTS!</h4>
        <p>Fact 1: Dinosaurs are extinct</p>
        <p>Fact 2: Dinosaurs are extinct</p>
        <p>Fact 3: Dinosaurs are extinct</p>
        <p>Fact 4: Dinosaurs are extinct</p>
        <p>Fact 5: Dinosaurs are extinct</p>
      </div>

      <div class="dinosaur-image-section">
        <img src="img/dino-img-sec.jpeg" alt="dinosaur with feathers">
        <p>200,million year old somethingasaurus</p>
      </div>
    </section>

    <!-- RESTART GAME BUTTON  -->
    <div class="restart-zone">
      <button class="restart-button">Restart Mini Game?</button>
    </div>

  </body>
</html>

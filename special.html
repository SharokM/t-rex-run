<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>T Rex Run: Special</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- HEADER TITLE/ HERO  -->
    <header class="header">
      <h1 class="header-h1">🦖DINOSAUR RUN🦖</h1>

      <!-- NAV AREA  -->
      <nav>
        <div class="nav-header">
          <!-- LOGO IN LIGHT & DARK VERSIONS TO ADD -->
          <div class="nav-logo">
            <a href="#">
              <img src="" alt="dark logo" class="nav-logo-dark" />
              <img src="" alt="light logo" class="nav-logo-light" />
            </a>
          </div>
        </div>

        <!-- NAV BAR  -->
        <ul class="nav-links" id="navbar">
          <li class="dropdown">
            <button class="dropdown-button">MENU</button>
            <ul class="dropdown-content">
              <li><a href="#home">HOME</a></li>
              <li><a href="#">SPECIAL</a></li>
              <li><a href="#menu">MENU</a></li>
              <li><a href="#event">EVENT</a></li>
              <li><a href="contact.html">CONTACT</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </header>

    <!--SPECIAL PAGE IMAGE API SECTION -->
    <section class="special-facts" id="special">
      <h2 class="special-section-title">
        CLICK HERE FOR A RANDOM DINOSAUR FACT!
      </h2>
      <!-- BUTTON REPLACE WITH DINOSAUR FACT FROM API -->
      <div class="dinosaur-fact-list hide">
        <h3 class="fact-header">
          🦕 DINOSAUR FACT! 🦕: <span class="author"></span>
        </h3>
        <figure>
          <img class="api-img" alt="Dinosaur Fact Image" />
        </figure>
      </div>
      <button class="fact-button">Show me an image!</button>
    </section>

    <!-- GAME  -->
    <section class="game-section">
      <h4>Press SPACE to jump!</h4>
      <button class="restart-button">Restart</button>
      <div id="desert" class="desert">
        <div class="grid">
          <div class="dino"></div>
        </div>
      </div>
      <div id="special-alert"></div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
